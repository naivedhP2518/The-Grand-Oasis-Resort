<!-- Floating Action Button -->
<div class="chatbot-fab-container">
  <button 
    (click)="toggleChat()" 
    class="chatbot-fab shadow-lg"
    [class.active]="isOpen()"
  >
    @if (isOpen()) {
      <i class="fa-solid fa-xmark"></i>
    } @else {
      <i class="fa-solid fa-comments"></i>
      <span class="active-pulse"></span>
    }
  </button>
</div>

<!-- Chat Window Overlay -->
@if (isOpen()) {
  <div class="chatbot-window bg-white/95 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.15)] border border-white/40 animate-in slide-in-from-bottom-5 duration-500">
    
    <!-- Chat Header -->
    <div class="chatbot-header d-flex justify-content-between align-items-center" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="d-flex align-items-center gap-3" style="display: flex; align-items: center; gap: 12px;">
        <div class="bot-avatar-container">
          <i class="fa-solid fa-crown text-amber-600"></i>
          <span class="online-indicator"></span>
        </div>
        <div>
          <h5 class="m-0 text-sm font-black text-slate-900 tracking-tight" style="margin: 0; font-size: 14px; font-weight: 900;">The Grand Oasis AI</h5>
          <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest block" style="font-size: 9px; font-weight: bold; letter-spacing: 0.1em;">Luxury Concierge</span>
        </div>
      </div>
      
      <button (click)="clearHistory()" class="btn-clear hover:text-danger transition-colors" title="Clear History" style="background: transparent; border: none; cursor: pointer;">
        <i class="fa-solid fa-trash-can text-slate-400"></i>
      </button>
    </div>

    <!-- Message Stream -->
    <div class="chatbot-messages pr-1" style="height: 380px; overflow-y: auto;">
      @for (msg of messages(); track msg.timestamp.getTime()) {
        <div class="message-row d-flex mb-4" [style.justify-content]="msg.role === 'user' ? 'flex-end' : 'flex-start'" style="display: flex; margin-bottom: 16px;">
          
          @if (msg.role === 'model') {
            <div class="msg-avatar">
              <i class="fa-solid fa-gem text-amber-700"></i>
            </div>
          }

          <div 
            class="message-bubble" 
            [class.user-bubble]="msg.role === 'user'"
            [class.bot-bubble]="msg.role === 'model'"
          >
            <p class="m-0 leading-relaxed font-serif italic text-xs" style="margin: 0; font-size: 12px; line-height: 1.6;">{{ msg.text }}</p>
            <span class="timestamp-label text-[8px] mt-1.5 block opacity-50" style="font-size: 8px; margin-top: 6px; display: block; opacity: 0.5;">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>

        </div>
      }

      <!-- Typing Indicator -->
      @if (isTyping()) {
        <div class="message-row d-flex mb-4" style="display: flex; margin-bottom: 16px;">
          <div class="msg-avatar">
            <i class="fa-solid fa-gem text-amber-700"></i>
          </div>
          <div class="message-bubble bot-bubble d-flex align-items-center py-3" style="display: flex; align-items: center; padding: 12px 18px; gap: 4px;">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      }
    </div>

    <!-- Message Input Bar -->
    <div class="chatbot-input-bar">
      <input 
        type="text" 
        [value]="userInput()" 
        (input)="userInput.set($any($event.target).value)"
        (keydown.enter)="sendMessage()"
        placeholder="Inquire about villas, check-in, spa..."
        class="chat-input"
      >
      <button (click)="sendMessage()" [disabled]="!userInput().trim()" class="btn-send">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>

  </div>
}
